[project]
name = "wheel-leg-analysis"
version = "0.1.0"
description = "Verified Python reproduction of a five-bar wheel-leg model"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "sympy>=1.12,<2",
    "matplotlib>=3.6,<4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "matplotlib.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pytest", "sympy"]
ignore_missing_imports = true
